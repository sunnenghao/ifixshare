name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          xcodebuild -list -project MiyuNote.xcodeproj || true

      - name: Build (unsigned)
        run: |
          if xcodebuild -list -project MiyuNote.xcodeproj 2>/dev/null | sed -n '/Schemes:/,$p' | grep -q "MiyuNote"; then
            echo "Using scheme"
            xcodebuild -project MiyuNote.xcodeproj -scheme MiyuNote \
              -configuration Release -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          else
            echo "No scheme, using target"
            xcodebuild -project MiyuNote.xcodeproj -target MiyuNote \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          fi

      - name: Package IPA
        run: |
          APP=$(find build -type d -name "MiyuNote.app" | head -1)
          echo "Found app at: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r MiyuNote-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MiyuNote-ipa
          path: MiyuNote-unsigned.ipa
